server {
    # Render injecte la variable PORT (par défaut 10000)
    listen 10000 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Taille max des uploads (images d'annonces)
    client_max_body_size 12M;

    # Logs
    access_log /dev/stdout;
    error_log /dev/stderr;

    # Fichiers statiques (assets compilés, images, uploads)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Uploads d'annonces
    location /uploads/ {
        alias /var/www/html/public/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Toutes les requêtes passent par index.php (front controller Symfony)
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # PHP-FPM
    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;

        # Timeout plus long pour les requêtes lourdes
        fastcgi_read_timeout 300;

        # Empêcher l'accès direct à index.php
        internal;
    }

    # Bloquer l'accès aux fichiers .php autres que index.php
    location ~ \.php$ {
        return 404;
    }

    # Bloquer l'accès aux fichiers cachés
    location ~ /\. {
        deny all;
    }
}
